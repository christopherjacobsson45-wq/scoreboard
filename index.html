<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poängbordet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E5B40">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: varm spelkväll, tydlig som ett protokollblock
   IDEA: kortbordet – filtgrönt bord där ställningen ligger som spelkort
   PICTURE: stor ställning med kortlika placeringsmärken överst i varje spel
   COLOUR and TYPE: filtgrönt, vitt kort, kortrött accent; Rubik rakt igenom
   LAYOUT: en kolumn för mobilen, flikar längst ner, ark som glider upp */
:root{color-scheme:light dark;--bg:light-dark(#F3F5F3,#0F1311);--card:light-dark(#FFFFFF,#1A201D);--ink:light-dark(#121916,#ECF0ED);--mute:light-dark(#525E58,#A6B2AB);--line:light-dark(#D9DFDB,#2C3631);--felt:light-dark(#0E5B40,#0B4532);--feltink:#F2F7F4;--red:light-dark(#C8102E,#FF6B7D);--soft:light-dark(#E7EEE9,#22302A)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-skin=vin]{--felt:light-dark(#7A1F35,#5C1628);--red:light-dark(#8A5A00,#F2C14E);--soft:light-dark(#F1E6E8,#2E1F23)}
:root[data-skin=hav]{--felt:light-dark(#1D4E89,#163B68);--red:light-dark(#B4232F,#FF7A7A);--soft:light-dark(#E4ECF5,#1C2A3B)}
:root[data-skin=natt]{color-scheme:dark;--bg:#0D1015;--card:#161B23;--ink:#E8EDF3;--mute:#A0AAB8;--line:#2A313D;--soft:#20262F;--felt:#262F40;--red:#FF8A5B}
.hbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--feltink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw button{min-height:88px;border-radius:14px;border:2px solid var(--line);cursor:pointer;color:#fff;font-weight:700;display:flex;align-items:flex-end;padding:10px;text-align:left}
.sw button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--felt);color:var(--feltink);padding:calc(18px + env(safe-area-inset-top)) 18px 22px}
header h1{margin:0;font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.01em}
header p{margin:4px 0 0;color:#CFE3D8;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:22px;line-height:1.15;margin:8px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1}
.mute{color:var(--mute);font-size:14px}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--mute)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--felt);color:var(--feltink);border-color:transparent}
.btn.red{color:var(--red)}
.btn.wide{width:100%}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tap:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.tap{all:unset;display:block;cursor:pointer;width:100%;box-sizing:border-box}
.board{display:grid;gap:8px;margin:12px 0}
.place{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.pc{flex:none;width:38px;height:52px;border-radius:6px;background:#fff;border:1px solid #C9CFCB;box-shadow:0 2px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;justify-content:space-between;padding:3px 5px;font-weight:800;font-size:15px;color:#121916}
.pc.r{color:#C8102E}.pc span:last-child{align-self:flex-end;transform:rotate(180deg)}
.place .nm{font-size:18px;font-weight:500}
.place .sc{font-size:clamp(26px,8vw,36px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--soft);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--felt)}
.lead .sc{color:var(--red)}
.banner{background:var(--felt);color:var(--feltink);border-radius:14px;padding:12px 14px;margin:12px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;font-size:13px;color:var(--mute)}
nav button[aria-current=page]{color:var(--felt);font-weight:700}
nav button:focus-visible{outline:3px solid var(--red)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
label.f{display:grid;gap:6px;font-size:14px;font-weight:500;margin:10px 0}
input[type=text],input[type=number],select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;font-size:16px}
textarea{min-height:120px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:10px 12px;background:var(--card)}
legend{font-weight:700;padding:0 6px}
.fl{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;margin:6px 0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:24px;height:24px;accent-color:var(--felt)}
.pre{font-weight:700;text-align:right;color:var(--felt)}
code{background:var(--soft);padding:2px 6px;border-radius:6px;font-size:13px;overflow-wrap:anywhere}
.ai{background:var(--felt);color:var(--feltink);border:0}
.ai .mute{color:#CFE3D8}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.answer{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.empty{text-align:center;padding:28px 12px}
.warn{color:var(--red);font-size:14px;font-weight:500;margin:6px 0}.warn.bad{font-weight:800}
tr.fut td{color:var(--mute)}tr.fut{cursor:default}tr.cur td{background:var(--soft)}
.plump{color:var(--red);font-weight:700}
tfoot td{font-weight:800;border-top:2px solid var(--ink)}
.rt th,.rt td{text-align:left;white-space:normal}.rt tbody tr{cursor:auto}
.panel h3{font-size:18px;margin:18px 0 6px}
</style>
</head>
<body>
<header><div class="row"><div class="grow"><h1 id="ttl">Poängbordet</h1><p id="sub">Räkna poäng till kvällens spel</p></div><button class="hbtn" data-act="theme" aria-label="Byt tema"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2s-1-1.5-1-2.5 1-1.5 2-1.5h2a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg></button></div></header>
<main id="main"><p class="mute">Laddar…</p></main>
<nav aria-label="Flikar">
<button data-act="tab" data-v="spela"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="11" height="15" rx="2"/><path d="M10 3h9a2 2 0 0 1 2 2v13"/></svg>Spela</button>
<button data-act="tab" data-v="bibliotek"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v16H4zM14 4h6v16h-6z"/></svg>Spel</button>
<button data-act="tab" data-v="kamp"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10v5a5 5 0 0 1-10 0zM5 5H3v2a4 4 0 0 0 4 4M19 5h2v2a4 4 0 0 1-4 4M12 14v4M8 21h8"/></svg>Kamp</button>
<button data-act="tab" data-v="historik"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historik</button>
</nav>
<div id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const r2=x=>Math.round(x*100)/100;
const dstr=t=>new Date(t).toLocaleDateString('sv-SE',{day:'numeric',month:'short'});
const FN={min:Math.min,max:Math.max,abs:Math.abs,round:Math.round,floor:Math.floor,ceil:Math.ceil};

/* ---------- Räknemotorn: en liten säker formeltolk ---------- */
function compile(src){
  const toks=[],re=/\s*(?:(\d+(?:\.\d+)?)|([a-z_][a-z0-9_]*)|(==|!=|>=|<=|&&|\|\||[-+*\/()?:<>!,]))/y;
  src=String(src||'').toLowerCase();
  while(re.lastIndex<src.length){const at=re.lastIndex,m=re.exec(src);
    if(!m){if(/^\s*$/.test(src.slice(at)))break;throw Error('Okänt tecken i formeln vid "'+src.slice(at,at+6)+'"')}
    if(m[1])toks.push({n:+m[1]});else if(m[2])toks.push({id:m[2]});else toks.push({op:m[3]})}
  let p=0;const ids=new Set();const is=o=>toks[p]&&toks[p].op===o;const eat=o=>{if(!is(o))throw Error('Formeln saknar "'+o+'"');p++};
  const bin=(next,ops)=>()=>{let l=next();while(toks[p]&&ops[toks[p].op]){const f=ops[toks[p++].op],a=l,b=next();l=e=>f(a(e),b(e))}return l};
  const B=x=>x?1:0;
  const prim=()=>{const t=toks[p++];if(!t)throw Error('Formeln tar slut för tidigt');
    if('n' in t)return()=>t.n;
    if(t.id){if(is('(')){const fn=FN[t.id];if(!fn)throw Error('Okänd funktion: '+t.id);p++;const args=[];if(!is(')')){args.push(tern());while(is(',')){p++;args.push(tern())}}eat(')');return e=>fn(...args.map(a=>a(e)))}
      ids.add(t.id);return e=>+e[t.id]||0}
    if(t.op==='('){const x=tern();eat(')');return x}
    if(t.op==='-'){const x=prim();return e=>-x(e)}
    if(t.op==='!'){const x=prim();return e=>B(!x(e))}
    throw Error('Oväntat "'+t.op+'" i formeln')};
  const mul=bin(prim,{'*':(a,b)=>a*b,'/':(a,b)=>b?a/b:0});
  const add=bin(mul,{'+':(a,b)=>a+b,'-':(a,b)=>a-b});
  const cmp=bin(add,{'<':(a,b)=>B(a<b),'>':(a,b)=>B(a>b),'<=':(a,b)=>B(a<=b),'>=':(a,b)=>B(a>=b)});
  const eq=bin(cmp,{'==':(a,b)=>B(a==b),'!=':(a,b)=>B(a!=b)});
  const and=bin(eq,{'&&':(a,b)=>B(a&&b)});
  const or=bin(and,{'||':(a,b)=>B(a||b)});
  function tern(){const c=or();if(is('?')){p++;const a=tern();eat(':');const b=tern();return e=>c(e)?a(e):b(e)}return c}
  const f=tern();if(p<toks.length)throw Error('Formeln har något extra i slutet');
  return {f,ids};
}
const cache={};
const getF=src=>(cache[src]||(cache[src]=compile(src))).f;
const oname=o=>typeof o==='string'?o:(o&&o.namn)||'';
const goals=g=>(g.omgangar||[]).map(oname);
function rdef(g,j){const o=(g.omgangar||[])[j];return o&&typeof o==='object'&&o.falt?{falt:o.falt,formel:o.formel,info:o.info}:g}
function score(g,vals,j){const d=rdef(g,j),env={};(g.params||[]).forEach(x=>env[x.key]=+x.value||0);d.falt.forEach(x=>env[x.key]=+((vals||{})[x.key])||0);try{return r2(getF(d.formel)(env))}catch(e){return 0}}
function md(t){const L=String(t||'').split('\n');let h='',i=0;const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');const blk=/^(## |\||[-*] |\d+[.)] )/;
  while(i<L.length){const l=L[i].trim();if(!l){i++;continue}
    if(l.startsWith('## ')){h+='<h3>'+inl(l.slice(3))+'</h3>';i++;continue}
    if(l.startsWith('|')){const rows=[];while(i<L.length&&L[i].trim().startsWith('|')){const c=L[i].trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());if(!c.every(x=>/^:?-+:?$/.test(x)))rows.push(c);i++}if(rows.length)h+='<div class="scroll"><table class="rt"><thead><tr>'+rows[0].map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
    if(/^[-*] /.test(l)){h+='<ul>';while(i<L.length&&/^[-*] /.test(L[i].trim())){h+='<li>'+inl(L[i].trim().slice(2))+'</li>';i++}h+='</ul>';continue}
    if(/^\d+[.)] /.test(l)){h+='<ol>';while(i<L.length&&/^\d+[.)] /.test(L[i].trim())){h+='<li>'+inl(L[i].trim().replace(/^\d+[.)] /,''))+'</li>';i++}h+='</ol>';continue}
    const p=[];while(i<L.length&&L[i].trim()&&!blk.test(L[i].trim())){p.push(L[i].trim());i++}h+='<p>'+inl(p.join(' '))+'</p>'}
  return h}
function validate(raw){
  if(!raw||typeof raw!=='object')throw Error('Kunde inte tolka reglerna, försök igen');
  const key=/^[a-z_][a-z0-9_]*$/;
  const g={name:String(raw.name||'Nytt spel').slice(0,60),kategori:String(raw.kategori||'Övrigt'),summary:String(raw.summary||''),
    spelare:{min:+(raw.spelare&&raw.spelare.min)||2,max:+(raw.spelare&&raw.spelare.max)||8},
    vinnare:raw.vinnare==='lagst'?'lagst':'hogst',slut:{typ:'fritt'},params:[],falt:[],formel:String(raw.formel||''),regler:String(raw.regler||'').slice(0,8000),omgangar:Array.isArray(raw.omgangar)?raw.omgangar.map(String).filter(Boolean).slice(0,40):[]};
  const s=raw.slut||{};if((s.typ==='mal'||s.typ==='rundor')&&+s.varde>0)g.slut={typ:s.typ,varde:+s.varde};
  (raw.params||[]).forEach(x=>{if(x&&key.test(x.key))g.params.push({key:x.key,label:String(x.label||x.key),value:+x.value||0})});
  (raw.falt||[]).forEach(x=>{if(x&&key.test(x.key))g.falt.push({key:x.key,label:String(x.label||x.key),typ:x.typ==='bock'?'bock':'tal',hjalp:x.hjalp?String(x.hjalp):''})});
  if(!g.falt.length)throw Error('Regelfilen saknar fält att fylla i');
  const known=new Set([...g.params,...g.falt].map(x=>x.key));
  const {ids}=compile(g.formel);ids.forEach(i=>{if(!known.has(i))throw Error('Formeln använder okänt namn: '+i)});
  return g;
}

/* ---------- Förinlagda spel ---------- */
const BUILTIN=[{"id": "b-plump", "name": "Plump", "kategori": "Kortspel", "summary": "Bjud på hur många stick du tar. Exakt rätt ger 10 plus antalet stick. Du väljer startomgång, och appen visar vem som bjuder och vilket bud som är förbjudet.", "spelare": {"min": 2, "max": 8}, "vinnare": "hogst", "slut": {"typ": "fritt"}, "plump": true, "params": [{"key": "bonus", "label": "Bonus för rätt bud", "value": 10}, {"key": "nollbud", "label": "Poäng för lyckat nollbud", "value": 10}], "falt": [{"key": "bud", "label": "Bud", "typ": "tal"}, {"key": "stick", "label": "Tagna stick", "typ": "tal"}], "formel": "stick == bud ? (bud == 0 ? nollbud : bonus + bud) : 0", "regler": "## Så spelar ni\n- En vanlig kortlek med 52 kort och två eller fler spelare.\n- Varje omgång delas ett bestämt antal kort ut. Spelarna bjuder i tur och ordning på hur många stick de tror att de tar.\n- Summan av alla bud får aldrig gå jämnt ut med antalet kort. Den som bjuder sist kan alltså inte alltid välja fritt. Appen visar vilket bud som är förbjudet.\n- Man måste följa färg. Saknar man färgen får man lägga vilket kort som helst. Högsta kortet i den utspelade färgen tar sticket.\n\n## Omgångar\nNi väljer startomgång när spelet startar, till exempel 10 kort. Sedan blir det ett kort färre per omgång ner till 1, och därefter ett kort mer per omgång upp till start igen. Ni väljer också hur många enkortsomgångar ni kör, till exempel en per spelare så att alla får starta budgivningen.\n\n## Enkortsomgången\nBestäm variant innan:\n- Alla tittar på sitt kort och bjuder 0 eller 1.\n- Alla håller kortet mot pannan och ser bara de andras kort.\n- Ingen tittar, alla chansar.\n\n## Poäng\n| Resultat | Poäng |\n| --- | --- |\n| Exakt rätt antal stick | 10 + antal stick |\n| Rätt på nollbud | 10 |\n| Fel antal stick | 0 (plump) |\n\nFlest poäng efter sista omgången vinner."}, {"id": "b-chicago", "name": "Chicago", "kategori": "Kortspel", "summary": "Pokerhänder, sista sticket och Chicago. Först till 52 vinner. Appen varnar vid köpstopp på 41.", "spelare": {"min": 2, "max": 6}, "vinnare": "hogst", "slut": {"typ": "mal", "varde": 52}, "grans": {"varde": 41, "text": "Köpstopp"}, "params": [{"key": "sistap", "label": "Sista sticket", "value": 2}, {"key": "tvap", "label": "Sista sticket med en tvåa", "value": 5}, {"key": "chicagop", "label": "Chicago", "value": 15}], "falt": [{"key": "hand", "label": "Handpoäng den här given", "typ": "tal", "hjalp": "Summan av poängen för händer enligt tabellen"}, {"key": "sista", "label": "Tog sista sticket", "typ": "bock"}, {"key": "tvaa", "label": "Sista sticket med en tvåa", "typ": "bock"}, {"key": "chicago", "label": "Chicago: 1 lyckad, -1 misslyckad", "typ": "tal"}], "formel": "hand + (tvaa ? tvap : (sista ? sistap : 0)) + chicago * chicagop", "regler": "## Så spelar ni\n- En vanlig kortlek utan jokrar och två eller fler spelare. Alla får fem kort per giv.\n- Ni byter kort två eller tre gånger, bestäm antalet innan. Målet är en så bra pokerhand som möjligt. Efter varje byte utom det sista får den med bäst hand poäng enligt tabellen.\n- Därefter spelas fem stick. Spelaren till vänster om given spelar ut, och man måste följa färg. Den som tar sista sticket får poäng.\n- Given går medsols efter varje omgång.\n\n## Chicago\nDen som ropar Chicago lovar att ta alla fem stick och spelar ut först. Lyckas det blir det +15, annars −15. När någon har ropat Chicago ges inga handpoäng den given. Spelaren närmast given har förtur att ropa Chicago.\n\n## Köpstopp\nFrån 41 poäng får man inte byta kort längre, utan spelar på korten man fick från början. Appen visar när någon har köpstopp.\n\n## Poäng\n| Händelse | Poäng |\n| --- | --- |\n| Par | 1 |\n| Två par | 2 |\n| Triss | 3 |\n| Stege | 4 |\n| Färg | 5 |\n| Kåk | 6 |\n| Fyrtal | 8 |\n| Färgstege | 11 |\n| Royal flush | 20 |\n| Sista sticket | 2 |\n| Sista sticket med en tvåa | 5 |\n| Lyckad Chicago | +15 |\n| Misslyckad Chicago | −15 |\n\nRoyal straight flush vinner hela spelet direkt. Först till 52 poäng vinner.", "ref": "| Händelse | Poäng |\n| --- | --- |\n| Par | 1 |\n| Två par | 2 |\n| Triss | 3 |\n| Stege | 4 |\n| Färg | 5 |\n| Kåk | 6 |\n| Fyrtal | 8 |\n| Färgstege | 11 |\n| Royal flush | 20 |\n| Sista sticket | 2 |\n| Sista sticket med en tvåa | 5 |\n| Lyckad Chicago | +15 |\n| Misslyckad Chicago | −15 |"}, {"id": "b-canasta", "name": "Canasta", "kategori": "Kortspel", "summary": "Mälda kort plus canastor, röda treor och utgång, minus kort på handen. Först till 5 000 vinner. Skriv lagen som spelare.", "spelare": {"min": 2, "max": 6}, "vinnare": "hogst", "slut": {"typ": "mal", "varde": 5000}, "trappa": {"rubrik": "Minsta första mälning", "steg": [[null, 0, "15"], [0, 1500, "50"], [1500, 3000, "90"], [3000, null, "120"]]}, "params": [{"key": "ren", "label": "Naturlig canasta", "value": 500}, {"key": "bland", "label": "Blandad canasta", "value": 300}, {"key": "trea", "label": "Röd trea (styck)", "value": 100}, {"key": "fyra", "label": "Extra för alla fyra röda treor", "value": 400}, {"key": "ut", "label": "Utgång", "value": 100}, {"key": "doldp", "label": "Utgång direkt (gömd hand)", "value": 200}], "falt": [{"key": "malda", "label": "Poäng för mälda kort", "typ": "tal", "hjalp": "Även korten i canastorna"}, {"key": "hand", "label": "Poäng för kort kvar på handen", "typ": "tal"}, {"key": "rena", "label": "Naturliga canastor (antal)", "typ": "tal"}, {"key": "blandade", "label": "Blandade canastor (antal)", "typ": "tal"}, {"key": "treor", "label": "Röda treor (antal)", "typ": "tal", "hjalp": "Har laget inte mält alls: skriv antalet med minus"}, {"key": "utgang", "label": "Gick ut", "typ": "bock"}, {"key": "dold", "label": "Gick ut direkt (gömd hand)", "typ": "bock"}], "formel": "malda - hand + rena * ren + blandade * bland + treor * trea + (abs(treor) >= 4 ? (treor > 0 ? fyra : -fyra) : 0) + (dold ? doldp : (utgang ? ut : 0))", "regler": "## Så spelar ni\n- Två vanliga kortlekar plus fyra jokrar, totalt 108 kort.\n- Fyra spelare i två lag, partnern sitter mittemot. Alla får 11 kort.\n- Varje tur: dra ett kort från talongen (eller ta högen om ni får), mäla om ni kan och vill, och avsluta med att saka ett kort på högen.\n- En mälning är minst tre kort av samma valör, varav minst två naturliga. Jokrar och tvåor är vilda kort, högst tre per mälning.\n- Ett lag mäler bara en hög per valör, och får inte lägga kort på motståndarnas mälningar.\n\n## Canasta\nSju kort av samma valör är en canasta. Naturlig canasta (bara naturliga kort) ger 500, blandad canasta (med vilda kort) ger 300.\n\n## Högen\n- Ni får ta högen om ni kan mäla det översta kortet med kort från handen.\n- Ligger det ett vilt kort eller en röd trea i högen är den frusen. Då krävs två naturliga kort av samma valör som det översta kortet.\n- En sakad svart trea eller ett sakat vilt kort hindrar nästa spelare från att ta högen.\n\n## Röda och svarta treor\n- Röda treor läggs ut direkt och ersätts med ett nytt kort från talongen. De ger 100 styck, och alla fyra ger 800. Har laget inte mält något blir de minus.\n- Svarta treor får bara mälas när man går ut.\n\n## Första mälningen\nLagets första mälning måste vara värd minst:\n\n| Lagets poäng | Minst |\n| --- | --- |\n| Minus | 15 |\n| 0–1 495 | 50 |\n| 1 500–2 995 | 90 |\n| 3 000 eller mer | 120 |\n\nBonus för canastor och röda treor räknas inte in. Appen visar varje lags krav.\n\n## Gå ut\nMan får gå ut när laget har minst en canasta. Utgång ger 100, och utgång direkt (hela handen på en gång, utan tidigare mälning) ger 200.\n\n## Poäng\nMälda kort räknas plus och kort kvar på handen minus:\n\n| Kort | Poäng |\n| --- | --- |\n| Joker | 50 |\n| Ess eller tvåa | 20 |\n| Kung, dam, knekt, 10, 9, 8 | 10 |\n| 7, 6, 5, 4 och svart trea | 5 |\n\nFörst till 5 000 vinner. Två spelare: 15 kort var, dra två kort och saka ett, två canastor krävs för att gå ut. Tre spelare: 13 kort var och spel till 7 500.", "ref": "| Kort | Poäng |\n| --- | --- |\n| Joker | 50 |\n| Ess eller tvåa | 20 |\n| Kung, dam, knekt, 10, 9, 8 | 10 |\n| 7, 6, 5, 4 och svart trea | 5 |"}, {"id": "b-gin6", "name": "6 omgångars Gin & Rummy", "kategori": "Kortspel", "summary": "Elva kort och sex omgångar med var sin öppningshand. Kort på bordet ger plus, kort på handen minus, och vinnaren av omgången får bonus.", "spelare": {"min": 2, "max": 8}, "vinnare": "hogst", "slut": {"typ": "rundor", "varde": 6}, "omgangar": ["Två triss", "Ett triss & en stege", "Två stegar", "Tre triss", "Två triss & en stege", "Två stegar & ett triss (sista kortet måste också passa)"], "params": [{"key": "v29", "label": "Kort 2–9", "value": 5}, {"key": "v10", "label": "Kort 10–kung", "value": 10}, {"key": "vess", "label": "Ess", "value": 15}, {"key": "vjoker", "label": "Joker", "value": 25}, {"key": "bonus", "label": "Bonus för vunnen omgång", "value": 50}, {"key": "plusbord", "label": "Plus för kort på bordet (1 = ja, 0 = nej)", "value": 1}], "falt": [{"key": "b29", "label": "På bordet: 2–9 (antal)", "typ": "tal", "hjalp": "Räkna dina kombinationer, även kort andra byggt på"}, {"key": "b10", "label": "På bordet: 10–kung (antal)", "typ": "tal"}, {"key": "bess", "label": "På bordet: ess (antal)", "typ": "tal"}, {"key": "bj", "label": "På bordet: jokrar (antal)", "typ": "tal"}, {"key": "h29", "label": "På handen: 2–9 (antal)", "typ": "tal"}, {"key": "h10", "label": "På handen: 10–kung (antal)", "typ": "tal"}, {"key": "hess", "label": "På handen: ess (antal)", "typ": "tal"}, {"key": "hj", "label": "På handen: jokrar (antal)", "typ": "tal"}, {"key": "vann", "label": "Vann omgången", "typ": "bock"}], "formel": "plusbord * (b29 * v29 + b10 * v10 + bess * vess + bj * vjoker) - (h29 * v29 + h10 * v10 + hess * vess + hj * vjoker) + (vann ? bonus : 0)", "regler": "## Så spelar ni\n- 2–4 spelare: två kortlekar. 5–8 spelare: tre kortlekar. Två jokrar per lek.\n- Alla får elva kort. Resten blir draghögen, och ett kort vänds upp som sakhög.\n- Varje tur tar man antingen det översta kortet i sakhögen eller ett från draghögen. Tar spelaren i tur inte sakkortet får de andra ta det, men då också ett straffkort från draghögen. Den närmast till vänster har förtur.\n- Innan man har lagt ut omgångens öppningshand får man bara slänga ett kort.\n- När öppningshanden ligger ute får man lägga ut fler kombinationer och bygga på andras. Den som äger kombinationen får poängen för korten man bygger på.\n- Turen avslutas alltid med att man slänger ett kort i sakhögen.\n\n## Kombinationer\n- Triss: minst tre kort av samma valör.\n- Stege: minst fyra kort i följd i samma färg, om inget annat anges.\n- Ess räknas som 1 eller 14 i en stege, men stegen får inte gå runt (kung–ess–två).\n\n## Omgångar\n1. Två triss\n2. Ett triss & en stege\n3. Två stegar\n4. Tre triss\n5. Två triss & en stege\n6. Två stegar & ett triss (sista kortet måste också passa)\n\n## Slut på omgången\nOmgången är slut när någon har lagt ut alla kort utom ett, som slängs. I sista omgången måste även det sista kortet passa in.\n\n## Poäng\n| Kort | Poäng |\n| --- | --- |\n| 2–9 | 5 |\n| 10–kung | 10 |\n| Ess | 15 |\n| Joker | 25 |\n\nKort på bordet ger plus och kort på handen minus. Vinnaren av omgången får 50 i bonus. Flest poäng efter sista omgången vinner.\n\n## Varianter\n- Utan jokrar kan tvåorna vara jokrar.\n- Ofta ingen bonus för vunnen omgång.\n- Två straffkort i stället för ett när man tar ett sakkort utanför sin tur.\n- Bara minuspoäng för handen, inget plus för bordet.", "ref": "| Kort | Poäng |\n| --- | --- |\n| 2–9 | 5 |\n| 10–kung | 10 |\n| Ess | 15 |\n| Joker | 25 |"}, {"id": "b-gin15", "name": "15 omgångars Gin & Rummy", "kategori": "Kortspel", "summary": "Den långa varianten med 15 öppningshänder. Samma poäng: plus för bordet, minus för handen och bonus för vunnen omgång.", "spelare": {"min": 2, "max": 8}, "vinnare": "hogst", "slut": {"typ": "rundor", "varde": 15}, "omgangar": ["Två triss", "Ett triss & en stege", "Tre triss", "Två stegar", "En stege på fem kort & två triss", "Fyra triss", "Två stegar på fyra kort & ett triss", "Ett fyrtal & en stege på fem kort", "Två stegar på fem kort", "Ett femtal & två stegar på fyra kort", "Tre stegar på fyra kort", "Två fyrtal & ett triss", "Ett femtal & ett triss & ett par (paret får ej byggas på)", "En stege på fem kort & två fyrtal", "Två triss & resterande kort i en stege"], "params": [{"key": "v29", "label": "Kort 2–9", "value": 5}, {"key": "v10", "label": "Kort 10–kung", "value": 10}, {"key": "vess", "label": "Ess", "value": 15}, {"key": "vjoker", "label": "Joker", "value": 25}, {"key": "bonus", "label": "Bonus för vunnen omgång", "value": 50}, {"key": "plusbord", "label": "Plus för kort på bordet (1 = ja, 0 = nej)", "value": 1}], "falt": [{"key": "b29", "label": "På bordet: 2–9 (antal)", "typ": "tal", "hjalp": "Räkna dina kombinationer, även kort andra byggt på"}, {"key": "b10", "label": "På bordet: 10–kung (antal)", "typ": "tal"}, {"key": "bess", "label": "På bordet: ess (antal)", "typ": "tal"}, {"key": "bj", "label": "På bordet: jokrar (antal)", "typ": "tal"}, {"key": "h29", "label": "På handen: 2–9 (antal)", "typ": "tal"}, {"key": "h10", "label": "På handen: 10–kung (antal)", "typ": "tal"}, {"key": "hess", "label": "På handen: ess (antal)", "typ": "tal"}, {"key": "hj", "label": "På handen: jokrar (antal)", "typ": "tal"}, {"key": "vann", "label": "Vann omgången", "typ": "bock"}], "formel": "plusbord * (b29 * v29 + b10 * v10 + bess * vess + bj * vjoker) - (h29 * v29 + h10 * v10 + hess * vess + hj * vjoker) + (vann ? bonus : 0)", "regler": "## Så spelar ni\n- 2–4 spelare: två kortlekar. 5–8 spelare: tre kortlekar. Två jokrar per lek.\n- Alla får elva kort. Resten blir draghögen, och ett kort vänds upp som sakhög.\n- Varje tur tar man antingen det översta kortet i sakhögen eller ett från draghögen. Tar spelaren i tur inte sakkortet får de andra ta det, men då också ett straffkort från draghögen. Den närmast till vänster har förtur.\n- Innan man har lagt ut omgångens öppningshand får man bara slänga ett kort.\n- När öppningshanden ligger ute får man lägga ut fler kombinationer och bygga på andras. Den som äger kombinationen får poängen för korten man bygger på.\n- Turen avslutas alltid med att man slänger ett kort i sakhögen.\n\n## Kombinationer\n- Triss: minst tre kort av samma valör.\n- Stege: minst fyra kort i följd i samma färg, om inget annat anges.\n- Ess räknas som 1 eller 14 i en stege, men stegen får inte gå runt (kung–ess–två).\n\n## Omgångar\n1. Två triss\n2. Ett triss & en stege\n3. Tre triss\n4. Två stegar\n5. En stege på fem kort & två triss\n6. Fyra triss\n7. Två stegar på fyra kort & ett triss\n8. Ett fyrtal & en stege på fem kort\n9. Två stegar på fem kort\n10. Ett femtal & två stegar på fyra kort\n11. Tre stegar på fyra kort\n12. Två fyrtal & ett triss\n13. Ett femtal & ett triss & ett par (paret får ej byggas på)\n14. En stege på fem kort & två fyrtal\n15. Två triss & resterande kort i en stege\n\n## Slut på omgången\nOmgången är slut när någon har lagt ut alla kort utom ett, som slängs. I sista omgången måste även det sista kortet passa in.\n\n## Poäng\n| Kort | Poäng |\n| --- | --- |\n| 2–9 | 5 |\n| 10–kung | 10 |\n| Ess | 15 |\n| Joker | 25 |\n\nKort på bordet ger plus och kort på handen minus. Vinnaren av omgången får 50 i bonus. Flest poäng efter sista omgången vinner.\n\n## Varianter\n- Utan jokrar kan tvåorna vara jokrar.\n- Ofta ingen bonus för vunnen omgång.\n- Två straffkort i stället för ett när man tar ett sakkort utanför sin tur.\n- Bara minuspoäng för handen, inget plus för bordet.", "ref": "| Kort | Poäng |\n| --- | --- |\n| 2–9 | 5 |\n| 10–kung | 10 |\n| Ess | 15 |\n| Joker | 25 |"}, {"id": "b-sjuan", "name": "Hela sjuan", "kategori": "Kortspel", "summary": "Sju omgångar med olika uppdrag, från Sjuan till Allt. Minst poäng vinner.", "spelare": {"min": 3, "max": 6}, "vinnare": "lagst", "slut": {"typ": "rundor", "varde": 7}, "omgangar": [{"namn": "Sjuan", "info": "Bli av med korten. Ett poäng per kort kvar på handen.", "falt": [{"key": "kort", "label": "Kort kvar på handen", "typ": "tal"}], "formel": "kort"}, {"namn": "Så lite som möjligt", "info": "Ta så få stick som möjligt.", "falt": [{"key": "stick", "label": "Antal stick", "typ": "tal"}], "formel": "stick"}, {"namn": "Så mycket som möjligt", "info": "Ta så många stick som möjligt. Varje stick är minus.", "falt": [{"key": "stick", "label": "Antal stick", "typ": "tal"}], "formel": "-stick"}, {"namn": "Klöver", "info": "Undvik klöver. Ett poäng per klöver.", "falt": [{"key": "klover", "label": "Klöver i dina stick", "typ": "tal"}], "formel": "klover * kloverp"}, {"namn": "Damer", "info": "Undvik damer. Fem poäng per dam.", "falt": [{"key": "damer", "label": "Damer i dina stick", "typ": "tal"}], "formel": "damer * damp"}, {"namn": "Svarta kungar och sista sticket", "info": "Tio poäng per svart kung och för sista sticket.", "falt": [{"key": "kungar", "label": "Svarta kungar", "typ": "tal"}, {"key": "sista", "label": "Tog sista sticket", "typ": "bock"}], "formel": "kungar * kungp + (sista ? sistap : 0)"}, {"namn": "Allt", "info": "Klöver, damer, svarta kungar och sista sticket gäller samtidigt.", "falt": [{"key": "klover", "label": "Klöver i dina stick", "typ": "tal", "hjalp": "Räkna klöver dam och klöver kung även här"}, {"key": "damer", "label": "Damer i dina stick", "typ": "tal"}, {"key": "kungar", "label": "Svarta kungar", "typ": "tal"}, {"key": "sista", "label": "Tog sista sticket", "typ": "bock"}], "formel": "klover * kloverp + damer * damp + kungar * kungp + (sista ? sistap : 0)"}], "params": [{"key": "kloverp", "label": "Klöver (styck)", "value": 1}, {"key": "damp", "label": "Dam (styck)", "value": 5}, {"key": "kungp", "label": "Svart kung (styck)", "value": 10}, {"key": "sistap", "label": "Sista sticket", "value": 10}], "falt": [{"key": "poang", "label": "Poäng", "typ": "tal"}], "formel": "poang", "regler": "## Så spelar ni\n- Alla kort delas ut så att alla får lika många. Tre spelare tar bort spader 2.\n- Spelet har sju omgångar med olika uppdrag. Målet är att få så få poäng som möjligt. Minst poäng efter sju omgångar vinner.\n- I alla stickomgångar måste man följa färg. Saknar man färgen får man slänga valfritt kort.\n\n## 1. Sjuan\nDen som har hjärter 7 börjar. Man lägger ett kort i taget i följd uppåt eller nedåt i samma färg, eller en ny sjua. Kan man inte lägga säger man pass och får ett kort av spelaren före. Kan man lägga ut alla sina kort på en gång får man göra det. Lägger man en kung eller ett ess vänds den högen, och man får välja att lägga igen eller låta turen gå vidare. De andra får ett poäng per kort kvar på handen.\n\n## 2. Så lite som möjligt\nTa så få stick som möjligt. Ett poäng per stick.\n\n## 3. Så mycket som möjligt\nTa så många stick som möjligt. Varje stick ger minus ett.\n\n## 4. Klöver\nUndvik stick med klöver. Varje klöver ger ett poäng. Man får spela ut klöver redan från början.\n\n## 5. Damer\nUndvik damer. Varje dam ger fem poäng.\n\n## 6. Svarta kungar och sista sticket\nSvarta kungar och sista sticket ger tio poäng var.\n\n## 7. Allt\nAllt från omgång 4–6 gäller samtidigt: klöver 1, damer 5, svarta kungar 10 och sista sticket 10. Klöver dam blir alltså 6 och klöver kung 11.\n\n## Poäng\n| Omgång | Poäng |\n| --- | --- |\n| 1. Sjuan | 1 per kort kvar |\n| 2. Så lite som möjligt | 1 per stick |\n| 3. Så mycket som möjligt | −1 per stick |\n| 4. Klöver | 1 per klöver |\n| 5. Damer | 5 per dam |\n| 6. Svarta kungar och sista sticket | 10 per kung, 10 för sista sticket |\n| 7. Allt | Alla ovan, från omgång 4–6 |"}, {"id": "b-norsk", "name": "Norsk", "kategori": "Kortspel", "summary": "Mall utan inlagda regler: poängen skrivs in för hand. Tryck på \"Ändra med egna ord\" och beskriv hur ni räknar.", "spelare": {"min": 2, "max": 8}, "vinnare": "hogst", "slut": {"typ": "fritt"}, "params": [], "falt": [{"key": "poang", "label": "Poäng", "typ": "tal"}], "formel": "poang", "regler": "Inga regler är inlagda ännu. Tryck på Redigera regler och skriv in hur ni spelar."}, {"id": "b-brad", "name": "Brädspel – slutpoäng", "kategori": "Brädspel", "s const allGames=()=>[...Object.values(S.games).sort((a,b)=>(b.skapad||0)-(a.skapad||0)),...BUILTIN];

const totals=s=>s.players.map((_,i)=>r2(s.rounds.reduce((t,r,j)=>t+score(s.game,r.v[i],j),0)));

function trappa(g,v){const st=(g.trappa.steg||[]).find(x=>(x[0]==null||v>=x[0])&&(x[1]==null||v<x[1]));return st?st[2]:''}
function plumpPlan(st,et){const a=[];for(let k=st;k>=2;k--)a.push(k);for(let k=0;k<et;k++)a.push(1);for(let k=2;k<=st;k++)a.push(k);return a}
function ranks(vals,low){const o=vals.map((v,i)=>({v,i})).sort((a,b)=>low?a.v-b.v:b.v-a.v);const rk=[];o.forEach((x,j)=>{rk[x.i]=j&&x.v===o[j-1].v?rk[o[j-1].i]:j+1});return{order:o.map(x=>x.i),rk}}
function ended(s){const g=s.game,t=totals(s);if(goals(g).length&&s.rounds.length>=goals(g).length)return true;if(g.slut.typ==='mal')return t.some(x=>x>=g.slut.varde);if(g.slut.typ==='rundor')return s.rounds.length>=g.slut.varde;return false}
const slutTxt=g=>g.slut.typ==='mal'?'Först till '+g.slut.varde:g.slut.typ==='rundor'?g.slut.varde+(g.slut.varde==1?' runda':' rundor'):'Spela så länge ni vill';
const SUITS=['♥','♠','♦','♣'];
function pcard(n){const s=SUITS[(n-1)%4];return '<span class="pc'+((n-1)%2?'':' r')+'" aria-hidden="true"><span>'+n+s+'</span><span>'+n+s+'</span></span>'}
function board(names,vals,low,unit){const {order,rk}=ranks(vals,low);const mx=Math.max(1,...vals.map(Math.abs));
  return '<div class="board">'+order.map(i=>'<div class="place'+(rk[i]===1?' lead':'')+'">'+pcard(rk[i])+'<div class="grow"><div class="nm">'+esc(names[i])+'</div><div class="bar"><i style="width:'+Math.max(2,Math.abs(vals[i])/mx*100)+'%"></i></div></div><div class="sc">'+vals[i]+(unit||'')+'</div></div>').join('')+'</div>'}
function kampPts(k){const n=k.spelare.length,sk=String(k.skala||'').split(/[ ,;]+/).filter(x=>x!=='').map(Number).filter(x=>!isNaN(x));
  return k.spelare.map(p=>k.moments.reduce((t,m)=>{const pl=+m.plac[p];if(!pl)return t;return t+(sk.length?(sk[pl-1]||0):Math.max(0,n-pl+1))},0))}

function vSession(s){const g=s.game,t=totals(s),low=g.vinnare==='lagst',klar=s.status==='klar',go=goals(g),n=s.rounds.length,np=s.players.length;

    h+='</tbody><tfoot><tr><td>Summa</td>'+t.map(x=>'<td>'+x+'</td>').join('')+'</tr></tfoot></table></div><p class="mute">Tryck på en spelad omgång för att ändra den.</p>'}

const RULES='Formatet:\n{"name":"Spelets namn","kategori":"Kortspel | Brädspel | Tärningsspel | Övrigt","summary":"2–3 meningar på svenska om hur poängen räknas och hur man vinner","spelare":{"min":2,"max":6},"vinnare":"hogst" eller "lagst","slut":{"typ":"mal","varde":500} eller {"typ":"rundor","varde":10} eller {"typ":"fritt"},"params":[{"key":"bonus","label":"Bonus för rätt bud","value":10}],"falt":[{"key":"stick","label":"Tagna stick","typ":"tal","hjalp":"kort förklaring"}],"formel":"stick == bud ? bonus + bud : 0","omgangar":["Två triss","Ett triss & en stege"]}\n\nRegler för formatet:\n- "falt" är det som fylls i för VARJE spelare efter varje runda. typ "tal" är ett tal, "bock" är ja/nej (1 eller 0).\n- "formel" räknar ut EN spelares poäng för rundan och får bara använda den spelarens fält och params. Tillåtet: tal, + - * /, parenteser, == != < > <= >=, && || !, villkor a ? b : c och funktionerna min() max() abs() round().\n- "params" är värden som spelarna kan vilja ändra som husregler (kortvärden, bonusar, avdrag). Använd dem i formeln i stället för fasta tal.\n- Alla key ska vara små bokstäver a-z, siffror och _ (inga å, ä, ö).\n- Om poängen beror på andra spelare (t.ex. vinnaren får motståndarnas kortpoäng), låt spelaren skriva in resultatet direkt i ett fält.\n- För brädspel med flera poängkategorier: ett fält per kategori och slut {"typ":"rundor","varde":1}.\n- "omgangar" är valfri: en lista med vad som krävs eller gäller i varje omgång, i ordning (t.ex. öppningshänder i rummy). Annars [].\n- "regler": en kort sammanfattning av spelreglerna på svenska med egna ord. Använd ## för rubriker, - för punkter och | för tabeller, och ta med en poängtabell.\n- Labels och summary på svenska.\nSvara ENDAST med JSON, ingen annan text.';
async function askJSON(prompt,images){const opts={modelTier:'default'};if(images&&images.length)opts.images=images;let raw;
  try{if(typeof sample.json==='function')return await sample.json(prompt,opts)}catch(e){if(e&&(e.code==='not_granted'||e.code==='rate_limited'))throw Error(e.code==='rate_limited'?'För många förfrågningar just nu, vänta en stund.':'Funktionen är inte tillåten här.')}
  try{raw=await sample(prompt,opts)}catch(e){throw Error(e&&e.code==='rate_limited'?'För många förfrågningar just nu, vänta en stund.':'Fick inget svar, försök igen.')}
  const t=raw&&raw.text||'',a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0)throw Error('Kunde inte tolka reglerna, försök igen.');return JSON.parse(t.slice(a,b+1))}

function roundSheet(s,j){const g=s.game,ed=j!=null,ix=ed?j:s.rounds.length,r=ed?clone(s.rounds[j]):{id:uid(),v:{}},d=rdef(g,ix),gl=goals(g)[ix],n=s.players.length;

      let ss=0,sa=true;order.forEach(i=>{const t=(r.v[i]||{}).stick;if(has(t))ss+=+t;else sa=false});pn.querySelector('#ssum').textContent=sa?(ss===pl.kort?'Sticken stämmer: '+ss+' av '+pl.kort+'.':'Obs: sticken blir '+ss+', men omgången har '+pl.kort+' kort.'):'';

  else if(a==='rule-q'&&s)ruleQ(s);
  else if(a==='rules'&&s)rulesSheet(s.gameId,s.game);
  else if(a==='finish'&&s){const t=totals(s),{order,rk}=ranks(t,s.game.vinnare==='lagst');const n=clone(s);n.status='klar';n.klar=Date.now();n.vinnare=order.filter(i=>rk[i]===1).map(i=>s.players[i]);put('sessions',n.id,n);toast('Sparat i historiken')}
  else if(a==='resume'&&s){const n=clone(s);n.status='pagar';put('sessions',n.id,n)}
  else if(a==='to-kamp'&&s)toKampSheet(s);
  else if(a==='del-session'&&s){if(arm(b)){del('sessions',s.id);view={tab:view.tab};render()}}
  else if(a==='new-kamp')kampSheet();
  else if(a==='add-moment'&&k)momentSheet(k);
  else if(a==='del-moment'&&k){if(arm(b)){const n=clone(k);n.moments.splice(+b.dataset.i,1);put('kamper',n.id,n)}}
  else if(a==='del-kamp'&&k){if(arm(b)){del('kamper',k.id);view={tab:'kamp'};render()}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click()});
document.addEventListener('change',e=>{if(e.target.id==='filt'){filt=e.target.value;render()}});

/* ---------- Start ---------- */
render();
const cl=window.claude;
(async()=>{try{db=cl&&cl.use?await cl.use('db'):null}catch(e){db=null}
  if(!db){loadLocal();render();return}
  let ok=0;const timer=setTimeout(()=>{if(!ok)toast('Kan inte nå sparade spel än – visar det som finns')},10000);
  Object.keys(S).forEach(c=>db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=clone(d.data())});S[c]=o;if(!snap.metadata.fromCache){ok=1;clearTimeout(timer)}render()},()=>toast('Synken avbröts – ladda om sidan')));
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{try{sample=cl&&cl.use?await cl.use('sample'):null;if(sample&&sample.limits){const l=await sample.limits();canImg=!!(l&&l.images)}}catch(e){sample=null}render()})();
}
</script>
